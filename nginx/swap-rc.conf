# Sample nginx site config for the swap-rc status page.
# Copy to /etc/nginx/sites-available/swap-rc, symlink into sites-enabled, then `nginx -t && systemctl reload nginx`.
#
# The app itself binds to 127.0.0.1 only (see src/server.js) - it is never reachable
# except through this proxy. Put this behind HTTPS (certbot) and basic auth before
# exposing it publicly, since /status reveals wallet addresses and balances.

server {
    listen 80;
    server_name sweeper.example.com;

    # Restrict access - adjust to your office/VPN IP, or add auth_basic below.
    # allow 203.0.113.0/24;
    # deny all;

    location / {
        proxy_pass http://127.0.0.1:3300;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
